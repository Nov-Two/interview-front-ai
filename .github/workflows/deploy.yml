name: Deploy to Server (Direct Build)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASSWORD }}
          source: "."
          target: "/home/interview-front-ai"
          rm: true

      - name: Build and Run on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASSWORD }}
          script: |
            cd /home/interview-front-ai
            
            # Build image locally
            docker build -t interview-front-ai:latest .
            
            # Open firewall ports just in case (ufw/firewalld/iptables)
            ufw allow 3001/tcp || true
            firewall-cmd --zone=public --add-port=3001/tcp --permanent && firewall-cmd --reload || true
            iptables -I INPUT -p tcp --dport 3001 -j ACCEPT || true

            # Stop and remove old container
            docker stop interview-front-ai || true
            docker rm interview-front-ai || true
            
            # Run new container
            docker run -d \
              --name interview-front-ai \
              --restart always \
              -p 3001:80 \
              interview-front-ai:latest

            # Wait for container to start
            sleep 5

            # Diagnostic: Check if port is listening
            echo "=== Port 3001 Listener ==="
            netstat -tulpn | grep 3001 || echo "Port 3001 not found in netstat"

            # Diagnostic: Local connectivity test
            echo "=== Local Curl Test ==="
            curl -v http://127.0.0.1:3001/interview_ai/ || echo "Local curl failed"
              
            # Clean up unused images (dangling)
            docker image prune -f
